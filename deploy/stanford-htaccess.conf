# ---------------------------------------------------------------------------
# Stanford legacy site -> GitHub Pages redirect
#
# Upload to your Stanford AFS web directory AS ".htaccess" (leading dot, no
# .conf extension):
#
#     ~/WWW/.htaccess        i.e.  /afs/ir/users/d/a/daniancu/WWW/.htaccess
#
# Dotfiles are hidden, so confirm it arrived with `ls -a`, not `ls`.
#
# This version assumes the rest of ~/WWW/ is DELETED and .htaccess is the only
# file left. Apache applies these rules before looking for a file, so the
# redirects keep working with an otherwise empty directory.
#
# Uses anchored RedirectMatch rather than plain Redirect: Redirect does PREFIX
# matching and appends whatever is left of the path, so /~daniancu/Papers/x.pdf
# would be sent to /Papers/x.pdf on the new site, which does not exist there.
# RedirectMatch with ^...$ gives exact control.
#
# Order matters -- mod_alias takes the FIRST matching rule -- so specific rules
# come before the catch-all at the bottom.
#
# 301 (permanent) rather than the default 302: it tells search engines to
# transfer the old URL's standing to the new one.
# ---------------------------------------------------------------------------

# --- The old jemdoc pages, mapped to their new homes ----------------------
RedirectMatch 301 ^/~daniancu/bio\.html$         https://dan-a-iancu.github.io/bio/
RedirectMatch 301 ^/~daniancu/research\.html$    https://dan-a-iancu.github.io/research/
RedirectMatch 301 ^/~daniancu/students\.html$    https://dan-a-iancu.github.io/students/
RedirectMatch 301 ^/~daniancu/teaching\.html$    https://dan-a-iancu.github.io/teaching/
RedirectMatch 301 ^/~daniancu/exec_ed\.html$     https://dan-a-iancu.github.io/exec-ed/prosche-motors/
RedirectMatch 301 ^/~daniancu/future_coo\.html$  https://dan-a-iancu.github.io/exec-ed/prosche-motors/

# --- The home page, with or without index.html ---------------------------
RedirectMatch 301 ^/~daniancu/(index\.html)?$    https://dan-a-iancu.github.io/

# --- The two old asset trees, sent somewhere useful ----------------------
# Old direct PDF links such as
#   /~daniancu/Papers/Journal/17.Boosting_Sales/....pdf
# appear in published articles and other people's reference lists. The new site
# keeps each paper's PDF inside that paper's own page bundle under a different
# name, so there is no one-to-one mapping to redirect to. Sending the whole tree
# to /research/ means an old citation lands on the full publication list -- the
# paper is one click away -- instead of 404ing or dumping the reader on the home
# page.
RedirectMatch 301 ^/~daniancu/Papers/            https://dan-a-iancu.github.io/research/

# The old Teaching/ tree held the raw evaluation reports. Those are deliberately
# not republished; /teaching/evaluations/ carries quantitative summaries instead,
# so that is where these requests belong. NOTE: this rule is convenience, NOT
# privacy -- the files must actually be deleted from AFS. A redirect only hides
# them for as long as this file survives.
RedirectMatch 301 ^/~daniancu/Teaching/          https://dan-a-iancu.github.io/teaching/evaluations/

# --- Everything else ------------------------------------------------------
RedirectMatch 301 ^/~daniancu/                   https://dan-a-iancu.github.io/
