# ---------------------------------------------------------------------------
# Stanford legacy site -> GitHub Pages redirect
#
# Upload this file to your Stanford AFS web directory AS ".htaccess"
# (leading dot, no .conf extension):
#
#     ~/WWW/.htaccess        i.e.  /afs/ir/users/d/a/daniancu/WWW/.htaccess
#
# Dotfiles are hidden, so confirm it arrived with `ls -a`, not `ls`.
#
# Uses anchored RedirectMatch rather than plain Redirect: Redirect does PREFIX
# matching and appends whatever is left of the path, so a request for
# /~daniancu/Papers/x.pdf would be sent to /Papers/x.pdf on the new site, which
# does not exist there. RedirectMatch with ^...$ gives exact control.
#
# Order matters -- mod_alias takes the FIRST matching rule -- so the specific
# page rules come before the catch-all at the bottom.
# ---------------------------------------------------------------------------

# --- The old jemdoc pages, mapped to their new homes ----------------------
RedirectMatch 301 ^/~daniancu/bio\.html$         https://dan-a-iancu.github.io/bio/
RedirectMatch 301 ^/~daniancu/research\.html$    https://dan-a-iancu.github.io/research/
RedirectMatch 301 ^/~daniancu/students\.html$    https://dan-a-iancu.github.io/students/
RedirectMatch 301 ^/~daniancu/teaching\.html$    https://dan-a-iancu.github.io/teaching/
RedirectMatch 301 ^/~daniancu/exec_ed\.html$     https://dan-a-iancu.github.io/exec-ed/prosche-motors/
RedirectMatch 301 ^/~daniancu/future_coo\.html$  https://dan-a-iancu.github.io/exec-ed/prosche-motors/

# --- The home page, with or without index.html ---------------------------
RedirectMatch 301 ^/~daniancu/(index\.html)?$    https://dan-a-iancu.github.io/

# --- Everything else, EXCEPT the two asset trees -------------------------
# Direct links such as /~daniancu/Papers/Journal/17.Boosting_Sales/....pdf appear
# in published articles and in other people's reference lists. The new site keeps
# its PDFs inside each paper's page bundle under different names, so there is no
# clean one-to-one mapping; leaving the Papers/ and Teaching/ trees in place on
# AFS keeps those citations resolving. The (?!...) is a negative lookahead --
# "match anything under /~daniancu/ that does not start with Papers/ or Teaching/".
#
# Drop the lookahead (and the folders) only when you are willing to break them.
RedirectMatch 301 ^/~daniancu/(?!Papers/|Teaching/)  https://dan-a-iancu.github.io/
