# Paper topics
#
# EDIT THIS FILE to change how papers are grouped by theme on /research/.
# Consumed by scripts/gen_publications.py, which writes each paper's `topics:`
# front matter. After editing, run:
#     python3 scripts/gen_publications.py && sh scripts/promote_publications.sh
#
# Each topic has:
#   name  - the short label shown as a tag, a filter chip and in the URL.
#           Avoid '&': Hugo drops it when building the URL, leaving a double dash.
#   scope - what the topic covers; shown as the description on its topic page
# A paper may carry any number of codes, including none.

topics:
  opt:
    name:  Optimization
    scope: 'Optimization under uncertainty, Data-driven optimization'   # 19 papers
  sustain:
