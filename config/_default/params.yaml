# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Stanford Graduate School of Business'
    description: 'Dan A. Iancu is a Professor of Operations, Information, and Technology at the Stanford Graduate School of Business, working on responsible analytics and AI and data-driven optimization under uncertainty.'
    twitter: ''
#   analytics:
#     google_analytics: ''
#     baidu_tongji: ''
#     plausible: ''
#     fathom: ''
#     pirsch: ''
#   verification:
#     google: ''
#     baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Dan A. Iancu'

# Site footer
footer:
  copyright:
    notice: '© {year} Dan Iancu. All rights reserved.'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
